version: "3.8"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - CORS_ORIGINS=*
      # Uncomment and fill in to enable real Hedera HCS anchoring:
      # - HEDERA_ACCOUNT_ID=0.0.xxxxx
      # - HEDERA_PRIVATE_KEY=xxxxx
      # - HEDERA_NETWORK=testnet
      # - HEDERA_TOPIC_ID=0.0.xxxxx

  frontend:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
